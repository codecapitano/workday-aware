name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm test
      - run: npm run lint
      - run: npm run format-check
      - name: Verify Skills CLI local install
        run: npx skills@1.5.25 add . --skill workday-aware --agent codex --global --yes --copy
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          HOME: ${{ runner.temp }}/skills-home
